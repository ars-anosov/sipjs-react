    <script type="text/javascript">
      // Dev-дефолты: заполняем только отсутствующие ключи, чтобы не затирать значения пользователя
      const devDefaults = {
        // SIP-домен для AOR: sip:<номер>@sbc.pecom.ru
        domainWebRtc: 'sbc.pecom.ru',
        // Список WebRTC-эндпоинтов из round robin DNS: через запятую.
        endpointsWebRtc: 'wss://sbc.pecom.ru:9443',
        useIce: 'true',
        uriRestAuth: 'http://localhost:3000/user/ad',
        uriRestPhpAuth: 'http://localhost:3000/user/adphp',
        uriLkToken: 'http://localhost:3000/user/lk',
        uriLk: 'https://192-168-0-142.openvidu-local.dev:7443/',
        uriPhoneDir: 'http://localhost:3000/user/phonedir',
      };
      for (const [key, value] of Object.entries(devDefaults)) {
        if (!localStorage.getItem(key)) localStorage.setItem(key, value);
      }
    </script>
