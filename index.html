<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg" href="img/vite.svg" />
    <meta name="viewport" content="initial-scale=1, width=device-width" />
    <title>WebRTC phone</title>
  </head>
  <body>
    <script type="text/javascript">
      // Dev-дефолты: заполняем только отсутствующие ключи, чтобы не затирать значения пользователя
      const devDefaults = {
        uriWebRtc: 'wss://sbc.pecom.ru:9443',
        useIce: 'true',
        uriAdAuth: 'http://localhost:3000/user/ad',
        uriAdPhpAuth: 'http://localhost:3000/user/adphp',
        uriLkToken: 'http://localhost:3000/user/lk',
        uriLk: 'https://192-168-0-142.openvidu-local.dev:7443/',
        uriPhoneDir: 'http://localhost:3000/user/phonedir',
      };
      for (const [key, value] of Object.entries(devDefaults)) {
        if (!localStorage.getItem(key)) localStorage.setItem(key, value);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
