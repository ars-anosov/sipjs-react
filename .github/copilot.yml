rules:
  - id: project-context
    description: "Контекст репозитория sipjs-react"
    alwaysApply: true
    scope: "**/*"
    guidance: |
      WebRTC-телефон: SPA на sip.js и LiveKit. Канон — CLAUDE.md.
      Код: src/. Mock: mock/. Сборка: npm run build → dist (не править вручную).
      JavaScript (.js/.jsx), без TypeScript. Документация и комментарии — на русском.
      Стек: React 19, Vite 8, MUI 9, Redux 5+thunk, sip.js, livekit-client, ky.
      Команды: npm run dev (порт 3000), npm run build, npm run serve (4173).
      Минимальный diff. Без TS, тестов, CI и новых зависимостей без явного запроса.

  - id: sipjs-react
    description: "Соглашения React/Redux для проекта"
    alwaysApply: false
    scope: "src/**/*.{js,jsx}"
    guidance: |
      Функциональные компоненты, PropTypes для публичных props.
      components/ — презентация, containers/ — Redux (useSelector, bindActionCreators + useMemo).
      UI — Material UI.
      Action types в constants/redux.js: PHONECTL_, AUTHCTL_, LKTOKEN_/LK_.
      Reducers/actions: phoneControl, authControl, lkControl (*Rdcr / *Actions).
      Объекты sip.js — в phoneRuntime.js, не в Redux.
      HTTP через ky, ошибки — actions/utils/kyError.js.
      localStorage-ключи — constants/storage.js.
      Vite base: './' — относительные пути в dist.
